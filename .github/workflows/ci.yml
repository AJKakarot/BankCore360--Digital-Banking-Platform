name: BankCore360 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Java 21 Backend Build & Test Suite
  # =========================================================================
  backend-test:
    name: Java 21 Spring Boot Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Spring Boot Unit & Integration Tests
        run: ./mvnw clean test --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test
          FLYWAY_ENABLED: false
          JPA_DDL_AUTO: create-drop

  # =========================================================================
  # 2. Python AI Service Test Suite
  # =========================================================================
  ai-service-test:
    name: Python Multi-Agent AI Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Multi-Agent Pytest Suite
        run: |
          pytest ai-service/tests -v
        env:
          MOCK_LLM_RESPONSES: "true"
          ENVIRONMENT: test

  # =========================================================================
  # 3. Next.js Frontend Build
  # =========================================================================
  frontend-build:
    name: Next.js Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install

      - name: Build Next.js Application
        run: npm --prefix frontend run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_AI_URL: http://localhost:8000

  # =========================================================================
  # 4. Docker Compose Config Validation
  # =========================================================================
  docker-validation:
    name: Docker Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet
