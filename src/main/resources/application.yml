spring:
  application:
    name: BankCore360

  # DataSource configuration - Defaults to Neon PostgreSQL Cloud DB
  # Can be overridden via environment variables (DB_URL, DB_USERNAME, DB_PASSWORD)
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-morning-lake-b4h65mvq-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_0IFZmYOw1iqM}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA & Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

# Server configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Management & Health configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Springdoc OpenAPI / Swagger UI configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Cloudinary Cloud Storage Configuration
# Supports CLOUDINARY_URL (e.g. cloudinary://API_KEY:API_SECRET@CLOUD_NAME)
# or explicit CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
