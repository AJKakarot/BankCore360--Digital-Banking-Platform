spring:
  application:
    name: BankCore360

  # DataSource configuration - Defaults to Neon PostgreSQL Cloud DB
  # Can be overridden via environment variables (DB_URL, DB_USERNAME, DB_PASSWORD)
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-morning-lake-b4h65mvq-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_0IFZmYOw1iqM}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA & Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  # Apache Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      auto-create: false
    listener:
      auto-startup: ${app.kafka.enabled:false}
      ack-mode: RECORD
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.bankcore360.*,java.util.*,java.lang.*"

# BankCore360 Kafka Topics and Consumer Groups
app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      loan-events: ${TOPIC_LOAN_EVENTS:loan-events}
      kyc-events: ${TOPIC_KYC_EVENTS:kyc-events}
      approval-events: ${TOPIC_APPROVAL_EVENTS:approval-events}
      repayment-events: ${TOPIC_REPAYMENT_EVENTS:repayment-events}
      notification-events: ${TOPIC_NOTIFICATION_EVENTS:notification-events}
    consumer-groups:
      loan: ${GROUP_LOAN:bankcore360-loan-group}
      kyc: ${GROUP_KYC:bankcore360-kyc-group}
      approval: ${GROUP_APPROVAL:bankcore360-approval-group}
      repayment: ${GROUP_REPAYMENT:bankcore360-repayment-group}
      notification: ${GROUP_NOTIFICATION:bankcore360-notification-group}
      audit: ${GROUP_AUDIT:bankcore360-audit-group}

# Server configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Management & Health configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Springdoc OpenAPI / Swagger UI configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
