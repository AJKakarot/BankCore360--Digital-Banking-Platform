global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerting_rules.yml"

scrape_configs:
  - job_name: 'bankcore360-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:8080', 'host.docker.internal:8080']
        labels:
          application: 'BankCore360'
          environment: 'production-modular-monolith'

